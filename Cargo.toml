[package]
name = "pushgo-gateway"
version = "1.3.1"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
authors = ["PushGo Team <team@pushgo.dev>"]

[[bin]]
name = "pushgo-gateway"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3

[profile.profiling]
inherits = "release"
debug = 2
lto = "off"
codegen-units = 16

[dependencies]
tokio = { version = "1.53.1", features = [
    "io-util",
    "macros",
    "net",
    "signal",
    "rt-multi-thread",
    "sync",
    "time",
] }
arc-swap = { version = "1.9.2" }
axum = { version = "0.8.9", features = [
    "macros",
    "http1",
    "http2",
    "json",
    "matched-path",
    "ws",
] }
chrono = { version = "0.4.45", default-features = false, features = [
    "clock",
    "serde",
] }
clap = { version = "4.6.6", features = ["derive", "env"] }
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "gzip",
    "http2",
    "form",
    "rustls",
] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151" }
thiserror = { version = "2.0.19" }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
dashmap = "6.2.1"
flume = "0.12.0"
hashbrown = { version = "0.17.1", features = ["serde"] }
argon2 = "0.5.3"
blake3 = "1.8.6"
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-aws-lc-rs",
    "postgres",
    "mysql",
    "sqlite",
] }
rand = "0.10.2"
sha2 = "0.11.0"
base64 = "0.22.1"
async-trait = "0.1.91"
warp-link = { version = "0.1.0", git = "https://github.com/AldenClark/warp-link", rev = "7668ddc4733e9919a6962a6e110e9f9939b6fa91" }
warp-link-coordination = { version = "0.1.0", git = "https://github.com/AldenClark/warp-link", rev = "7668ddc4733e9919a6962a6e110e9f9939b6fa91" }
pushgo-warp-profile = { version = "0.1.0", git = "https://github.com/AldenClark/warp-link", rev = "7668ddc4733e9919a6962a6e110e9f9939b6fa91" }
futures-util = "0.3.33"
parking_lot = "0.12.5"
scc = "3.8.6"
rustls = "0.23.43"
tokio-rustls = "0.26.4"
mqttbytes = "0.6.0"
bytes = "1.12.1"
rmcp = { version = "1.8.0", features = ["transport-streamable-http-server"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "fmt",
    "json",
] }

[dev-dependencies]
tempfile = "3.27.0"
tower = "0.5.3"
tokio-tungstenite = { version = "0.29.0", features = [
    "rustls-tls-webpki-roots",
] }
