[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "armv7-unknown-linux-musleabihf",
]

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = [
    { name = "base64", version = "=0.22.1", reason = "axum, jsonwebtoken and SQLx retain base64 0.22" },
    { name = "hashbrown", version = "=0.16.1", reason = "SQLx core and hashlink retain hashbrown 0.16" },
    { name = "sha1", version = "=0.10.7", reason = "axum retains the digest 0.10 SHA-1 implementation" },
    { name = "tokio-tungstenite", version = "=0.29.0", reason = "axum retains tokio-tungstenite 0.29" },
    { name = "tungstenite", version = "=0.29.0", reason = "axum retains tungstenite 0.29" },
    # Pinned upstream crates still use these incompatible generations. Keep
    # every exception exact so any new duplicate fails the release gate.
    { name = "block-buffer", version = "=0.10.4", reason = "tungstenite SHA-1 remains on digest 0.10" },
    { name = "cpufeatures", version = "=0.2.17", reason = "axum SHA-1 and SQLx core remain on cpufeatures 0.2" },
    { name = "crypto-common", version = "=0.1.7", reason = "axum SHA-1 and SQLx core remain on crypto-common 0.1" },
    { name = "digest", version = "=0.10.7", reason = "axum SHA-1 and SQLx core remain on digest 0.10" },
    { name = "getrandom", version = "=0.3.4", reason = "tungstenite rand 0.9 retains the intermediate getrandom ABI" },
    { name = "hashbrown", version = "=0.14.5", reason = "dashmap retains hashbrown 0.14" },
    { name = "rand", version = "=0.9.5", reason = "axum tungstenite remains on rand 0.9 while warp-link uses rand 0.10" },
    { name = "rand_core", version = "=0.9.5", reason = "tungstenite rand 0.9 retains rand_core 0.9" },
    { name = "sha2", version = "=0.10.9", reason = "SQLx core retains sha2 0.10" },
    { name = "syn", version = "=2.0.119", reason = "application and SQLx macros remain on syn 2 while warp-link uses syn 3" },
    { name = "untrusted", version = "=0.7.1", reason = "aws-lc-rs retains the legacy untrusted ABI" },
    { name = "webpki-roots", version = "=0.26.11", reason = "SQLx and tungstenite retain the compatibility root bundle" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/AldenClark/warp-link"]
