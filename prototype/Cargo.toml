[package]
name = "free-delivery-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[[bin]]
name = "free_architecture_fixture"
path = "src/bin/free_architecture_fixture.rs"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3

[dependencies]
pushgo-gateway = { path = ".." }
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "signal", "rt-multi-thread", "sync", "time"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "json", "tokio", "ws"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "mysql"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "http2", "rustls"] }
futures-util = "=0.3.33"
rand = "=0.10.2"
blake3 = "=1.8.6"
thiserror = "=2.0.19"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
clap = { version = "=4.6.6", features = ["derive"] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
base64 = "=0.22.1"
argon2 = "=0.5.3"
hyper-util = { version = "=0.1.20", features = ["server-auto", "service", "tokio"] }
tower = { version = "=0.5.3", features = ["util"] }

async-trait = "=0.1.91"
bytes = "=1.12.1"
mqttbytes = "=0.6.0"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
warp-link = { version = "0.1.0", git = "https://github.com/AldenClark/warp-link", rev = "dbae3a80c8b796969cadc9045ee982a0a60c4d27" }
pushgo-warp-profile = { version = "0.1.0", git = "https://github.com/AldenClark/warp-link", rev = "dbae3a80c8b796969cadc9045ee982a0a60c4d27" }
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls = "=0.23.45"
tokio-rustls = "=0.26.4"

[dev-dependencies]
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "handshake"] }
tempfile = "=3.27.0"
