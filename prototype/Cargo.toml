[package]
name = "free-delivery-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[[bin]]
name = "free_architecture_fixture"
path = "src/bin/free_architecture_fixture.rs"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3

[dependencies]
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "signal", "rt-multi-thread", "sync", "time"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "json", "tokio"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "http2", "rustls"] }
futures-util = "=0.3.33"
rand = "=0.10.2"
blake3 = "=1.8.6"
thiserror = "=2.0.19"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
clap = { version = "=4.6.6", features = ["derive"] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"

[dev-dependencies]
tempfile = "=3.27.0"
