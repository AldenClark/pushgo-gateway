[workspace]
members = ["crates/warp-link-transport"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
authors = ["PushGo Team"]

[workspace.dependencies]
async-trait = "0.1.91"
bytes = "1.12.1"
futures-util = "0.3.33"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio"] }
rand = "0.10.2"
rustls = { version = "0.23.45", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "time",
  "sync",
  "net",
  "io-util",
] }
tokio-rustls = { version = "0.26.4", default-features = false, features = [
  "logging",
  "tls12",
] }
tokio-tungstenite = { version = "0.29.0", features = [
  "rustls-tls-webpki-roots",
] }
url = "2.5.8"
webpki-roots = "1.0.9"
sha2 = "0.11.0"
parking_lot = "0.12.5"
hex = "0.4.3"
flume = "0.12.0"
