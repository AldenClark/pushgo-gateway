name: Route transition quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-transition:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.97.1"
          components: rustfmt

      - name: Check formatting and release workflow contract
        run: |
          cargo fmt --all -- --check
          .github/scripts/static_release_audit.sh

      - name: Test library behavior outside external database fixtures
        run: cargo test --locked --lib -- --skip storage::storage::tests::backend_init

      - name: Test route transitions on real PostgreSQL and MySQL
        env:
          PUSHGO_REQUIRE_EXTERNAL_DB_TESTS: "1"
        run: cargo test --locked --lib route_transition_external_ -- --nocapture --test-threads=1
